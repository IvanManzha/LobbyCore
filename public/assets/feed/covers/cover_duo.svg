<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGradDuo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e2e"/>
      <stop offset="50%" style="stop-color:#101a1a"/>
      <stop offset="100%" style="stop-color:#090d0d"/>
    </linearGradient>
    <linearGradient id="accentGradDuo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <filter id="glowDuo">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradDuo)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.04">
    <pattern id="gridDuo" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#gridDuo)"/>
  </g>
  
  <!-- Accent glow -->
  <ellipse cx="960" cy="540" rx="550" ry="280" fill="#14b8a6" opacity="0.08" filter="url(#glowDuo)"/>
  
  <!-- Duo icon - two figures -->
  <g transform="translate(760, 380)" fill="none" stroke="url(#accentGradDuo)" stroke-width="3.5" opacity="0.7">
    <!-- Figure 1 -->
    <circle cx="100" cy="50" r="30"/>
    <path d="M100 85 L100 160"/>
    <path d="M100 110 L65 145"/>
    <path d="M100 110 L135 145"/>
    <path d="M100 160 L75 220"/>
    <path d="M100 160 L125 220"/>
    
    <!-- Figure 2 -->
    <circle cx="300" cy="50" r="30"/>
    <path d="M300 85 L300 160"/>
    <path d="M300 110 L265 145"/>
    <path d="M300 110 L335 145"/>
    <path d="M300 160 L275 220"/>
    <path d="M300 160 L325 220"/>
    
    <!-- Connection -->
    <path d="M135 110 L265 110" stroke-dasharray="8,8" opacity="0.5"/>
  </g>
  
  <!-- Decorative elements -->
  <g stroke="url(#accentGradDuo)" stroke-width="2" opacity="0.25">
    <line x1="150" y1="150" x2="400" y2="150"/>
    <line x1="1520" y1="930" x2="1770" y2="930"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="720" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" opacity="0.5">
    DUO
  </text>
</svg>
