<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGradSolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1a2e"/>
      <stop offset="50%" style="stop-color:#12101a"/>
      <stop offset="100%" style="stop-color:#0a090d"/>
    </linearGradient>
    <linearGradient id="accentGradSolo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glowSolo">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradSolo)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.04">
    <pattern id="gridSolo" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#gridSolo)"/>
  </g>
  
  <!-- Accent glow -->
  <ellipse cx="960" cy="540" rx="500" ry="250" fill="#a855f7" opacity="0.1" filter="url(#glowSolo)"/>
  
  <!-- Solo icon - single figure -->
  <g transform="translate(860, 380)" fill="none" stroke="url(#accentGradSolo)" stroke-width="4" opacity="0.7">
    <circle cx="100" cy="50" r="35"/>
    <path d="M100 90 L100 180"/>
    <path d="M100 120 L60 160"/>
    <path d="M100 120 L140 160"/>
    <path d="M100 180 L70 250"/>
    <path d="M100 180 L130 250"/>
  </g>
  
  <!-- Decorative elements -->
  <g stroke="url(#accentGradSolo)" stroke-width="2" opacity="0.25">
    <line x1="150" y1="150" x2="350" y2="150"/>
    <line x1="1570" y1="930" x2="1770" y2="930"/>
    <circle cx="1700" cy="200" r="40" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="720" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" opacity="0.5">
    SOLO
  </text>
</svg>
