<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход / Регистрация</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #f5f5f5;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 360px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      color: #222;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    input {
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }
    #login-btn {
      background: #1976d2;
      color: white;
    }
    #login-btn:hover {
      background: #1565c0;
    }
    #guest-btn {
      background: #e0e0e0;
      color: #333;
    }
    #guest-btn:hover {
      background: #d5d5d5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход / Регистрация</h1>
    <form id="login-form">
      <label for="pubgId">Ваш PUBG-ник</label>
      <input
        type="text"
        id="pubgId"
        name="pubgId"
        placeholder="Введите ваш ник"
        required
      />
      <button type="submit" id="login-btn">Войти</button>
    </form>
    <button id="guest-btn">Войти как гость</button>
    <button id="register-btn">Зарегистрироваться</button>
  </div>
  

  <script src="login.js"></script>
</body>
</html>
